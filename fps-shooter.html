<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D FPS Shooter - Enhanced Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #050510;
        }
        canvas { display: block; }
        #hud {
            position: absolute;
            color: #00ffcc;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.8);
            font-family: 'Courier New', monospace;
            user-select: none;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }
        #health-bar {
            position: absolute;
            bottom: 30px;
            left: 20px;
            width: 300px;
            height: 30px;
            border: 2px solid #00ffcc;
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }
        #health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0055, #ffcc00, #00ffcc);
            width: 100%;
            transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #ammo-counter {
            position: absolute;
            bottom: 30px;
            right: 20px;
            font-size: 24px;
            text-align: right;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 5px;
            border: 1px solid #00ffcc;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            pointer-events: none;
            transition: transform 0.1s;
        }
        .crosshair-line {
            position: absolute;
            background: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
        }
        #crosshair .horizontal { width: 20px; height: 2px; left: 5px; top: 14px; }
        #crosshair .vertical { width: 2px; height: 20px; top: 5px; left: 14px; }
        #crosshair.shooting { transform: translate(-50%, -50%) scale(1.5); }
        
        #kill-feed {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 16px;
            max-width: 300px;
        }
        .kill-message {
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 15px;
            margin: 5px 0;
            border-left: 4px solid #00ffcc;
            animation: slideIn 0.3s, fadeOut 3s 2.7s forwards;
            font-family: 'Courier New', Courier, monospace;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 5, 16, 0.95);
            padding: 50px;
            text-align: center;
            border: 2px solid #ff0055;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
            z-index: 1000;
            border-radius: 10px;
            pointer-events: auto;
        }
        #game-over h1 { color: #ff0055; font-size: 60px; margin-bottom: 20px; text-shadow: 0 0 20px #ff0055; }
        #game-over p { color: #00ffcc; font-size: 24px; margin: 10px 0; }
        #restart-btn { 
            margin-top: 30px; 
            padding: 15px 30px; 
            font-size: 20px; 
            background: transparent;
            color: #00ffcc; 
            border: 2px solid #00ffcc; 
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            border-radius: 5px;
        }
        #restart-btn:hover { background: #00ffcc; color: #000; box-shadow: 0 0 15px #00ffcc; }
        
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            font-size: 14px;
            line-height: 1.6;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 5px;
            border: 1px solid rgba(0, 255, 204, 0.3);
        }

        #cheat-console {
            display: none;
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ff00ff;
            padding: 10px;
            z-index: 2000;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }
        #cheat-console input {
            width: 100%;
            background: transparent;
            border: none;
            color: #ff00ff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            outline: none;
        }
        #cheat-console::before {
            content: "> ";
            color: #ff00ff;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            position: absolute;
            left: 10px;
        }
        #cheat-input {
            padding-left: 20px;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <strong>WASD</strong> - Move<br>
        <strong>Mouse</strong> - Look / Shoot<br>
        <strong>Space</strong> - Jump<br>
        <strong>` (Tilde)</strong> - Cheat Console
    </div>
    
    <div id="hud">
        <div id="kill-feed"></div>
    </div>
    
    <div id="crosshair">
        <div class="crosshair-line horizontal"></div>
        <div class="crosshair-line vertical"></div>
    </div>
    
    <div id="health-bar">
        <div id="health-fill"></div>
    </div>
    
    <div id="ammo-counter">AMMO: <span id="ammo">120</span></div>
    
    <div id="cheat-console">
        <input type="text" id="cheat-input" autocomplete="off" spellcheck="false">
    </div>
    
    <div id="game-over">
        <h1>SYSTEM FAILURE</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <p>Entities Purged: <span id="kill-count">0</span></p>
        <button id="restart-btn">REBOOT SYSTEM</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- AUDIO SYNTHESIZER ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'shoot') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            }
        }

        // --- PROCEDURAL TEXTURES ---
        function createGridTexture(color1, color2) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = color1;
            ctx.fillRect(0, 0, 512, 512);
            ctx.strokeStyle = color2;
            ctx.lineWidth = 4;
            
            for(let i=0; i<=512; i+=64) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
            }
            
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const hemisphereLight = new THREE.HemisphereLight(0x00ffcc, 0xff0055, 0.5);
        scene.add(hemisphereLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(50, 100, 50);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        // --- ENVIRONMENT ---
        const groundTex = createGridTexture('#0a0a1a', '#003333');
        groundTex.repeat.set(20, 20);
        const groundGeometry = new THREE.PlaneGeometry(400, 400);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            map: groundTex, 
            roughness: 0.2, 
            metalness: 0.8 
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const wallTex = createGridTexture('#111122', '#330033');
        wallTex.repeat.set(2, 2);
        
        function createBuilding(x, z, w, h, d) {
            const geometry = new THREE.BoxGeometry(w, h, d);
            const material = new THREE.MeshStandardMaterial({ 
                map: wallTex,
                roughness: 0.5,
                metalness: 0.5
            });
            const building = new THREE.Mesh(geometry, material);
            building.position.set(x, h / 2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);
            return building;
        }

        createBuilding(30, 0, 20, 25, 20);
        createBuilding(-30, 30, 20, 15, 20);
        createBuilding(0, -40, 15, 30, 15);
        createBuilding(40, 40, 10, 40, 10);
        createBuilding(-40, -40, 10, 20, 10);
        createBuilding(0, 40, 60, 10, 10); // Arch

        // --- PLAYER & CHEAT DATA ---
        const player = {
            velocity: new THREE.Vector3(),
            grounded: false,
            health: 100,
            maxHealth: 100,
            ammo: 120,
            kills: 0,
            score: 0,
            speedMultiplier: 1,
            godmode: false,
            infiniteAmmo: false,
            isDead: false
        };

        // --- INPUT HANDLING ---
        const keys = {};
        let isConsoleOpen = false;

        window.addEventListener('keydown', (e) => { 
            if (e.key === '`') {
                e.preventDefault();
                toggleCheatConsole();
                return;
            }
            if (!isConsoleOpen) keys[e.key.toLowerCase()] = true; 
        });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        let pitch = 0, yaw = 0;
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement && !player.isDead) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
            }
        });

        document.addEventListener('click', (e) => {
            if (!isConsoleOpen && !player.isDead && document.pointerLockElement !== renderer.domElement) {
                renderer.domElement.requestPointerLock();
            }
        });

        // --- SHOOTING ---
        let lastShotTime = 0;
        const shootCooldown = 120;
        const crosshair = document.getElementById('crosshair');

        document.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement !== renderer.domElement || player.isDead || isConsoleOpen) return;
            
            const now = Date.now();
            if (now - lastShotTime > shootCooldown && (player.ammo > 0 || player.infiniteAmmo)) {
                lastShotTime = now;
                if (!player.infiniteAmmo) player.ammo--;
                
                playSound('shoot');
                
                // Crosshair animation
                crosshair.classList.add('shooting');
                setTimeout(() => crosshair.classList.remove('shooting'), 50);

                shoot();
            }
        });

        function shoot() {
            const raycaster = new THREE.Raycaster(camera.position, camera.getWorldDirection(new THREE.Vector3()));
            const intersects = raycaster.intersectObjects(enemies.map(e => e.group), true);
            
            if (intersects.length > 0) {
                let target = intersects[0].object;
                while(target.parent && target.userData.health === undefined) {
                    target = target.parent;
                }
                
                if(target.userData && target.userData.health !== undefined) {
                    playSound('hit');
                    target.userData.health -= 35;
                    target.userData.hitEffect = 15;
                    
                    if (target.userData.health <= 0) {
                        removeEnemy(target);
                        player.kills++;
                        player.score += 150;
                        addKillMessage('Entity Purged :: +150 PTS');
                    }
                }
            }
        }

        // --- ENEMY SYSTEM ---
        const enemies = [];
        class Enemy {
            constructor(x, z) {
                this.group = new THREE.Group();
                this.group.position.set(x, 0, z);
                
                // Glowing Body
                const bodyGeom = new THREE.CylinderGeometry(0.5, 0.5, 2, 16);
                this.bodyMat = new THREE.MeshStandardMaterial({ 
                    color: 0xff0055, 
                    emissive: 0xff0055,
                    emissiveIntensity: 0.5,
                    roughness: 0.2 
                });
                this.body = new THREE.Mesh(bodyGeom, this.bodyMat);
                this.body.position.y = 1;
                this.body.castShadow = true;
                this.group.add(this.body);

                // Eye
                const eyeGeom = new THREE.BoxGeometry(0.6, 0.2, 0.6);
                const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                this.eye = new THREE.Mesh(eyeGeom, eyeMat);
                this.eye.position.set(0, 1.5, 0.3);
                this.group.add(this.eye);

                scene.add(this.group);

                this.group.userData = {
                    health: 100,
                    hitEffect: 0
                };

                this.velocity = new THREE.Vector3();
                this.speed = 3 + Math.random() * 2;
                enemies.push(this);
            }

            update(delta) {
                const toPlayer = new THREE.Vector3().subVectors(camera.position, this.group.position);
                toPlayer.y = 0; // Keep movement on ground plane
                const distToPlayer = toPlayer.length();

                if (distToPlayer < 50) {
                    const dir = toPlayer.normalize();
                    this.velocity.x = dir.x * this.speed;
                    this.velocity.z = dir.z * this.speed;
                    
                    // Rotate to face player
                    this.group.lookAt(camera.position.x, this.group.position.y, camera.position.z);
                }

                this.group.position.x += this.velocity.x * delta;
                this.group.position.z += this.velocity.z * delta;

                // Damage
                if (distToPlayer < 2 && Math.random() < 0.05 && !player.godmode) {
                    player.health -= 10;
                    if (player.health <= 0 && !player.isDead) endGame();
                }

                // Hit Flash Effect
                if (this.group.userData.hitEffect > 0) {
                    this.bodyMat.emissiveIntensity = 2;
                    this.bodyMat.color.setHex(0xffffff);
                    this.group.userData.hitEffect--;
                } else {
                    this.bodyMat.emissiveIntensity = 0.5;
                    this.bodyMat.color.setHex(0xff0055);
                }
            }
        }

        function removeEnemy(enemyGroup) {
            const index = enemies.findIndex(e => e.group === enemyGroup);
            if (index > -1) {
                scene.remove(enemyGroup);
                enemies.splice(index, 1);
            }
        }

        function spawnEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const distance = 40 + Math.random() * 40;
            new Enemy(Math.cos(angle) * distance, Math.sin(angle) * distance);
        }

        // --- CHEAT SYSTEM ---
        const cheatInput = document.getElementById('cheat-input');
        const cheatConsole = document.getElementById('cheat-console');

        function toggleCheatConsole() {
            isConsoleOpen = !isConsoleOpen;
            if (isConsoleOpen) {
                document.exitPointerLock();
                cheatConsole.style.display = 'block';
                cheatInput.value = '';
                setTimeout(() => cheatInput.focus(), 10);
            } else {
                cheatConsole.style.display = 'none';
                renderer.domElement.requestPointerLock();
            }
        }

        cheatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                processCheat(cheatInput.value.trim().toLowerCase());
                toggleCheatConsole();
            }
        });

        function processCheat(cmd) {
            switch(cmd) {
                case 'help':
                    window.open('cheats.html', '_blank');
                    break;
                case 'iddqd':
                case 'godmode':
                    player.godmode = !player.godmode;
                    addKillMessage(`SYS: GODMODE ${player.godmode ? 'ENABLED' : 'DISABLED'}`);
                    break;
                case 'idkfa':
                case 'ammo':
                    player.infiniteAmmo = !player.infiniteAmmo;
                    if(player.infiniteAmmo) player.ammo = 999;
                    addKillMessage(`SYS: INFINITE AMMO ${player.infiniteAmmo ? 'ENABLED' : 'DISABLED'}`);
                    break;
                case 'sonic':
                    player.speedMultiplier = player.speedMultiplier === 1 ? 2.5 : 1;
                    addKillMessage(`SYS: SPEED x${player.speedMultiplier}`);
                    break;
                case 'spawn':
                    spawnEnemy();
                    addKillMessage('SYS: ENTITY SPAWNED');
                    break;
                case 'heal':
                    player.health = player.maxHealth;
                    addKillMessage('SYS: HEALTH RESTORED');
                    break;
                default:
                    if(cmd !== '') addKillMessage('SYS: UNKNOWN COMMAND');
            }
        }

        // --- UI & GAME LOGIC ---
        function addKillMessage(msg) {
            const feed = document.getElementById('kill-feed');
            const div = document.createElement('div');
            div.className = 'kill-message';
            div.textContent = msg;
            feed.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        function endGame() {
            player.isDead = true;
            document.exitPointerLock();
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').textContent = player.score;
            document.getElementById('kill-count').textContent = player.kills;
        }

        document.getElementById('restart-btn').addEventListener('click', () => location.reload());

        // --- MAIN LOOP ---
        let lastTime = performance.now();
        
        function update() {
            const now = performance.now();
            const delta = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            if (player.isDead) return;

            // Movement Physics
            const moveDir = new THREE.Vector3();
            if (keys['w']) moveDir.z -= 1;
            if (keys['s']) moveDir.z += 1;
            if (keys['a']) moveDir.x -= 1;
            if (keys['d']) moveDir.x += 1;

            if (moveDir.length() > 0) {
                moveDir.normalize();
                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir);
                const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), camDir).normalize();
                const forward = new THREE.Vector3(camDir.x, 0, camDir.z).normalize();

                const speed = 8 * player.speedMultiplier;
                player.velocity.x = (right.x * moveDir.x + forward.x * moveDir.z) * speed;
                player.velocity.z = (right.z * moveDir.x + forward.z * moveDir.z) * speed;
            } else {
                player.velocity.x *= 0.8; // Friction
                player.velocity.z *= 0.8;
            }

            // Gravity & Jumping
            player.velocity.y -= 25 * delta;
            camera.position.y += player.velocity.y * delta;
            
            if (camera.position.y <= 1.6) {
                camera.position.y = 1.6;
                player.velocity.y = 0;
                player.grounded = true;
            } else {
                player.grounded = false;
            }

            if (keys[' '] && player.grounded && !isConsoleOpen) {
                player.velocity.y = 10;
                playSound('jump');
                keys[' '] = false; // Prevent holding space to bounce
            }

            // Apply horizontal movement
            camera.position.x += player.velocity.x * delta;
            camera.position.z += player.velocity.z * delta;

            // Map Bounds
            camera.position.x = Math.max(-190, Math.min(190, camera.position.x));
            camera.position.z = Math.max(-190, Math.min(190, camera.position.z));

            // Apply Camera Rotation
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            // Update Entities & Waves
            enemies.forEach(enemy => enemy.update(delta));

            if (enemies.length === 0) {
                for (let i = 0; i < 5 + Math.floor(player.kills / 2); i++) spawnEnemy();
                addKillMessage('SYS: NEW WAVE DETECTED');
            }

            // Update UI
            document.getElementById('ammo').textContent = player.infiniteAmmo ? '∞' : player.ammo;
            const healthPercent = Math.max(0, (player.health / player.maxHealth) * 100);
            document.getElementById('health-fill').style.width = healthPercent + '%';
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        // Init
        for (let i = 0; i < 5; i++) spawnEnemy();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
