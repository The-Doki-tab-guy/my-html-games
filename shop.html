<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNTH PURGE - BLACK MARKET</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 100vw; 
            height: 100vh; 
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            background: radial-gradient(circle, #1a0b2e 0%, #050510 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        #crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            z-index: 2000;
            opacity: 0.6;
        }
        h1 {
            color: #0ff;
            font-size: 60px;
            margin-top: 50px;
            text-shadow: 0 0 20px #0ff;
            text-transform: uppercase;
            letter-spacing: 5px;
        }
        #credits-display {
            font-size: 30px;
            color: #f0f;
            margin: 20px 0 50px 0;
            text-shadow: 0 0 15px #f0f;
            font-family: 'Courier New', Courier, monospace;
            background: rgba(255, 0, 255, 0.1);
            padding: 10px 30px;
            border: 2px solid #f0f;
        }
        .shop-container {
            display: flex;
            gap: 30px;
            z-index: 100;
        }
        .item-card {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #0ff;
            width: 300px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .item-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.6);
        }
        .item-title {
            color: #fff;
            font-size: 24px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .item-desc {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
            height: 60px;
        }
        .item-price {
            color: #f0f;
            font-size: 24px;
            font-family: 'Courier New', Courier, monospace;
            margin-bottom: 20px;
        }
        .buy-btn {
            padding: 15px 30px;
            font-size: 18px;
            background: transparent;
            color: #0ff;
            border: 2px solid #0ff;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .buy-btn:hover:not(:disabled) {
            background: #0ff;
            color: #000;
        }
        .buy-btn:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
        }
        .owned {
            background: #0ff !important;
            color: #000 !important;
        }
        #back-btn {
            margin-top: 60px;
            padding: 15px 40px;
            font-size: 20px;
            background: rgba(255, 0, 0, 0.1);
            color: #f00;
            border: 2px solid #f00;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            z-index: 100;
            text-decoration: none;
            transition: all 0.2s;
        }
        #back-btn:hover {
            background: #f00;
            color: #000;
            box-shadow: 0 0 25px #f00;
        }
    </style>
</head>
<body>
    <div id="crt-overlay"></div>
    <h1>BLACK MARKET</h1>
    <div id="credits-display">CREDITS: <span id="credits-val">0</span></div>
    
    <div class="shop-container">
        <div class="item-card">
            <div class="item-title">TITANIUM HULL</div>
            <div class="item-desc">Increases maximum system integrity (health) from 100 to 200.</div>
            <div class="item-price">1500 CR</div>
            <button class="buy-btn" onclick="buyItem('upgrade_health', 1500)" id="btn-upgrade_health">PURCHASE</button>
        </div>
        
        <div class="item-card">
            <div class="item-title">HYPER-DRIVE</div>
            <div class="item-desc">Permanently increases base movement velocity by 50%.</div>
            <div class="item-price">3000 CR</div>
            <button class="buy-btn" onclick="buyItem('upgrade_speed', 3000)" id="btn-upgrade_speed">PURCHASE</button>
        </div>
        
        <div class="item-card">
            <div class="item-title">AMMO SYNTHESIZER</div>
            <div class="item-desc">Start every run with double the maximum ammunition capacity.</div>
            <div class="item-price">2500 CR</div>
            <button class="buy-btn" onclick="buyItem('upgrade_ammo', 2500)" id="btn-upgrade_ammo">PURCHASE</button>
        </div>
    </div>

    <a href="https://my-html-games.spaminhaler5000.workers.dev/" id="back-btn">RETURN TO HUB</a>

    <script>
        let credits = parseInt(localStorage.getItem('synthPurge_credits')) || 0;
        
        function updateUI() {
            document.getElementById('credits-val').textContent = credits;
            
            checkItemState('upgrade_health', 1500);
            checkItemState('upgrade_speed', 3000);
            checkItemState('upgrade_ammo', 2500);
        }

        function checkItemState(itemId, cost) {
            const btn = document.getElementById(`btn-${itemId}`);
            if (localStorage.getItem(`synthPurge_${itemId}`) === 'true') {
                btn.textContent = 'INSTALLED';
                btn.classList.add('owned');
                btn.disabled = true;
            } else if (credits < cost) {
                btn.disabled = true;
            } else {
                btn.disabled = false;
            }
        }

        function buyItem(itemId, cost) {
            if (credits >= cost && localStorage.getItem(`synthPurge_${itemId}`) !== 'true') {
                credits -= cost;
                localStorage.setItem('synthPurge_credits', credits);
                localStorage.setItem(`synthPurge_${itemId}`, 'true');
                updateUI();
            }
        }

        updateUI();
    </script>
</body>
</html>
