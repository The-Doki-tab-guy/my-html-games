<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNTH PURGE - OVERDRIVE V5 MULTIPLAYER</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 100vw; height: 100vh; overflow: hidden; 
            font-family: 'Trebuchet MS', Arial, sans-serif; background: #000;
        }
        canvas { display: block; }
        
        #crt-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 3px, 3px 100%; pointer-events: none; z-index: 2000; opacity: 0.5;
        }

        #main-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a0b2e 0%, #050510 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 3000;
        }
        #main-menu h1 {
            color: #f0f; font-size: 80px; text-shadow: 0 0 40px #f0f, 0 0 15px #0ff;
            font-style: italic; letter-spacing: 10px; text-transform: uppercase; margin-bottom: 0px;
        }
        .version { color: #0ff; font-size: 20px; font-weight: bold; letter-spacing: 5px; margin-bottom: 20px; text-shadow: 0 0 10px #0ff; }
        
        .lobby-box {
            background: rgba(0,0,0,0.85); border: 2px solid #0ff; padding: 25px; width: 550px;
            box-shadow: 0 0 30px rgba(0,255,255,0.3); display: flex; flex-direction: column; gap: 15px;
        }
        .lobby-input {
            background: rgba(0,0,0,0.5); border: 1px solid #f0f; color: #0ff; padding: 12px;
            font-size: 18px; font-family: monospace; outline: none; text-transform: uppercase;
        }
        .menu-btn-container { display: flex; gap: 15px; }
        .main-btn {
            flex: 1; padding: 15px; font-size: 20px; background: rgba(255, 0, 255, 0.1);
            color: #fff; border: 2px solid #f0f; cursor: pointer; font-weight: bold;
            transition: all 0.2s; text-transform: uppercase;
        }
        .main-btn:hover { background: #f0f; color: #000; box-shadow: 0 0 30px #f0f; }

        #room-panel { display: none; margin-top: 15px; border-top: 1px dashed #0ff; padding-top: 15px; }
        #room-code-display { font-size: 24px; color: #ff0; text-shadow: 0 0 10px #ff0; margin-bottom: 10px; }
        #player-list { list-style: none; max-height: 150px; overflow-y: auto; text-align: left; }
        .player-item {
            display: flex; justify-content: space-between; align-items: center; padding: 6px;
            border-bottom: 1px solid rgba(255,0,255,0.2); font-family: monospace; color: #fff;
        }
        .op-badge { color: #0ff; font-weight: bold; margin-left: 10px; }
        .op-btn { background: transparent; border: 1px solid #f0f; color: #f0f; padding: 2px 8px; cursor: pointer; font-size: 12px; }
        .op-btn:hover { background: #f0f; color: #000; }

        #hud { display: none; position: absolute; color: #fff; font-weight: bold; font-family: 'Courier New', monospace; pointer-events: none; width: 100%; height: 100%; z-index: 100; }
        #health-bar-container { position: absolute; bottom: 40px; left: 40px; width: 400px; background: rgba(0, 0, 0, 0.6); border: 2px solid #0ff; padding: 5px; transform: skewX(-15deg); }
        #health-fill { height: 25px; background: linear-gradient(90deg, #f0f, #0ff); width: 100%; }
        
        #weapon-info { position: absolute; bottom: 40px; right: 40px; text-align: right; transform: skewX(-15deg); }
        #weapon-name { font-size: 32px; color: #f0f; text-shadow: 0 0 15px #f0f; background: rgba(0,0,0,0.6); padding: 5px 20px; border-right: 4px solid #f0f; }
        #ammo-counter { font-size: 48px; color: #0ff; text-shadow: 0 0 15px #0ff; background: rgba(0,0,0,0.6); padding: 5px 20px; border-right: 4px solid #0ff; }

        #crosshair { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; pointer-events: none; z-index: 100; }
        .crosshair-line { position: absolute; background: #0ff; box-shadow: 0 0 10px #0ff; }
        #crosshair .horizontal { width: 14px; height: 2px; left: -2px; top: 19px; }
        #crosshair .horizontal.right { left: 28px; }
        #crosshair .vertical { width: 2px; height: 14px; top: -2px; left: 19px; }
        #crosshair .vertical.bottom { top: 28px; }

        #kill-feed { position: absolute; top: 30px; right: 30px; font-size: 16px; max-width: 350px; }
        .kill-message { background: rgba(0, 0, 0, 0.8); padding: 10px 20px; margin: 8px 0; border-left: 4px solid #f0f; font-family: monospace; }

        #op-status-hud { position: absolute; top: 30px; left: 30px; font-size: 18px; color: #0ff; font-family: monospace; background: rgba(0,0,0,0.7); padding: 10px 20px; border-left: 4px solid #0ff; }

        #cheat-console { display: none; position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); width: 600px; background: rgba(0, 0, 0, 0.95); border: 2px solid #0ff; padding: 15px; z-index: 2000; }
        #cheat-console input { width: 100%; background: transparent; border: none; color: #0ff; font-family: 'Courier New', monospace; font-size: 22px; outline: none; text-transform: uppercase; }
        #cheat-console::before { content: "SYS_OVR> "; color: #0ff; font-size: 22px; font-family: 'Courier New', monospace; position: absolute; left: 15px; }
        #cheat-input { padding-left: 120px; }
    </style>
</head>
<body>

    <div id="crt-overlay"></div>

    <div id="main-menu">
        <h1>SYNTH PURGE</h1>
        <div class="version">OVERDRIVE V5 // MULTIPLAYER NET</div>

        <div class="lobby-box">
            <input type="text" id="server-url" class="lobby-input" value="ws://localhost:8080" placeholder="SERVER WS URL">
            <input type="text" id="player-name" class="lobby-input" value="CYBER_PILOT" placeholder="PLAYER NAME">
            
            <div class="menu-btn-container">
                <button class="main-btn" id="create-room-btn">HOST ROOM</button>
                <button class="main-btn" id="join-room-btn">JOIN ROOM</button>
            </div>
            
            <input type="text" id="join-code-input" class="lobby-input" placeholder="ROOM CODE (TO JOIN)">

            <div id="room-panel">
                <div id="room-code-display">ROOM: CODE</div>
                <ul id="player-list"></ul>
                <button class="main-btn" id="start-game-btn" style="margin-top: 15px; width: 100%;">LAUNCH GRID</button>
            </div>
        </div>
    </div>

    <div id="hud">
        <div id="op-status-hud">ROLE: <span id="role-text">PLAYER</span></div>
        <div id="kill-feed"></div>
        <div id="health-bar-container"><div id="health-fill"></div></div>
        <div id="weapon-info">
            <div id="weapon-name">V-BLASTER</div>
            <div id="ammo-counter">120</div>
        </div>
    </div>

    <div id="crosshair">
        <div class="crosshair-line horizontal"></div>
        <div class="crosshair-line horizontal right"></div>
        <div class="crosshair-line vertical"></div>
        <div class="crosshair-line vertical bottom"></div>
    </div>

    <div id="cheat-console">
        <input type="text" id="cheat-input" autocomplete="off" spellcheck="false">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let socket = null;
        let myPlayerId = null;
        let isOp = false;
        let isHost = false;
        let roomCode = null;
        let gameActive = false;

        const remotePlayers = {};

        // DOM elements
        const serverUrlInput = document.getElementById('server-url');
        const nameInput = document.getElementById('player-name');
        const joinCodeInput = document.getElementById('join-code-input');
        const roomPanel = document.getElementById('room-panel');
        const roomCodeDisplay = document.getElementById('room-code-display');
        const playerListUI = document.getElementById('player-list');

        function connectServer(callback) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                callback();
                return;
            }
            socket = new WebSocket(serverUrlInput.value);
            
            socket.onopen = () => {
                console.log("Connected to server");
                callback();
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleServerMessage(data);
            };

            socket.onerror = (err) => { alert("Connection Error to WebSocket server."); };
            socket.onclose = () => { addKillMessage("DISCONNECTED FROM SERVER"); };
        }

        document.getElementById('create-room-btn').addEventListener('click', () => {
            connectServer(() => {
                socket.send(JSON.stringify({ type: 'create_room', name: nameInput.value }));
            });
        });

        document.getElementById('join-room-btn').addEventListener('click', () => {
            const code = joinCodeInput.value.trim();
            if (!code) return alert("Enter a room code!");
            connectServer(() => {
                socket.send(JSON.stringify({ type: 'join_room', roomCode: code, name: nameInput.value }));
            });
        });

        document.getElementById('start-game-btn').addEventListener('click', () => {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';
            gameActive = true;
            renderer.domElement.requestPointerLock();
            animate();
        });

        function handleServerMessage(data) {
            if (data.type === 'room_created' || data.type === 'room_joined') {
                roomCode = data.roomCode;
                myPlayerId = data.playerId;
                isOp = data.isOp;
                isHost = data.isHost;
                
                roomPanel.style.display = 'block';
                roomCodeDisplay.textContent = `ROOM CODE: ${roomCode}`;
                updateRoleHUD();
            }

            else if (data.type === 'room_state_update') {
                playerListUI.innerHTML = '';
                data.players.forEach(p => {
                    const li = document.createElement('li');
                    li.className = 'player-item';
                    
                    let badges = p.isHost ? '[HOST] ' : '';
                    if (p.isOp) badges += '<span class="op-badge">[OP]</span>';

                    let opBtnHTML = '';
                    if (isOp && p.id !== myPlayerId && !p.isHost) {
                        opBtnHTML = `<button class="op-btn" onclick="toggleOp('${p.id}')">${p.isOp ? 'DEMOTE' : 'MAKE OP'}</button>`;
                    }

                    li.innerHTML = `<span>${badges} ${p.name}</span> ${opBtnHTML}`;
                    playerListUI.appendChild(li);

                    // Update local OP status if changed
                    if (p.id === myPlayerId) {
                        isOp = p.isOp;
                        updateRoleHUD();
                    }
                });
            }

            else if (data.type === 'player_moved') {
                if (!remotePlayers[data.playerId]) {
                    createRemotePlayerMesh(data.playerId);
                }
                const pMesh = remotePlayers[data.playerId];
                pMesh.position.set(data.transform.x, data.transform.y, data.transform.z);
                pMesh.rotation.y = data.transform.ry;
            }

            else if (data.type === 'cheat_executed') {
                addKillMessage(`[OP CHEAT] ${data.executorName}: executed ${data.cmd}`);
            }

            else if (data.type === 'cheat_result') {
                addKillMessage(`SYS: ${data.message}`);
            }

            else if (data.type === 'error') {
                alert(data.message);
            }
        }

        window.toggleOp = function(targetId) {
            if (socket) socket.send(JSON.stringify({ type: 'toggle_op', targetPlayerId: targetId }));
        }

        function updateRoleHUD() {
            document.getElementById('role-text').textContent = isOp ? (isHost ? 'HOST / OPERATOR' : 'OPERATOR') : 'PLAYER';
        }

        // --- THREE.JS ENGINE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.008);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        scene.add(new THREE.HemisphereLight(0x00ffff, 0xff00ff, 0.8));

        // Ground Grid
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ color: 0x111122, wireframe: true }));
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        function createRemotePlayerMesh(id) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshStandardMaterial({ color: 0x00ffff }));
            body.position.y = 1;
            group.add(body);
            scene.add(group);
            remotePlayers[id] = group;
        }

        // --- PLAYER & CONTROLS ---
        const keys = {};
        window.addEventListener('keydown', (e) => {
            if (e.key === '`') { e.preventDefault(); toggleCheatConsole(); return; }
            keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        let yaw = 0, pitch = 0;
        document.addEventListener('mousemove', (e) => {
            if (gameActive && document.pointerLockElement === renderer.domElement) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
            }
        });

        // --- CHEAT CONSOLE & OPERATOR PERMISSION CHECK ---
        const cheatInput = document.getElementById('cheat-input');
        const cheatConsole = document.getElementById('cheat-console');
        let isConsoleOpen = false;

        function toggleCheatConsole() {
            isConsoleOpen = !isConsoleOpen;
            if (isConsoleOpen) {
                document.exitPointerLock();
                cheatConsole.style.display = 'block';
                cheatInput.value = '';
                setTimeout(() => cheatInput.focus(), 10);
            } else {
                cheatConsole.style.display = 'none';
                if (gameActive) renderer.domElement.requestPointerLock();
            }
        }

        cheatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = cheatInput.value.trim().toLowerCase();
                
                // Send command to server to validate OP permission
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        type: 'cheat_command',
                        cmd: cmd
                    }));
                }

                toggleCheatConsole();
            }
        });

        function addKillMessage(msg) {
            const feed = document.getElementById('kill-feed');
            const div = document.createElement('div');
            div.className = 'kill-message';
            div.textContent = msg;
            feed.appendChild(div);
            setTimeout(() => div.remove(), 4000);
        }

        // --- GAME LOOP & NETWORK SYNC ---
        let lastNetSync = 0;

        function update() {
            if (!gameActive) return;

            // Movement Logic
            const moveDir = new THREE.Vector3();
            if (keys['w']) moveDir.z += 1;
            if (keys['s']) moveDir.z -= 1;
            if (keys['a']) moveDir.x += 1;
            if (keys['d']) moveDir.x -= 1;

            if (moveDir.length() > 0) {
                moveDir.normalize();
                const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir);
                const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), camDir).normalize();
                const forward = new THREE.Vector3(camDir.x, 0, camDir.z).normalize();
                
                camera.position.x += (right.x * moveDir.x + forward.x * moveDir.z) * 0.3;
                camera.position.z += (right.z * moveDir.x + forward.z * moveDir.z) * 0.3;
            }

            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            // Broadcast transform to server every 50ms (20 ticks/sec)
            const now = performance.now();
            if (socket && socket.readyState === WebSocket.OPEN && now - lastNetSync > 50) {
                lastNetSync = now;
                socket.send(JSON.stringify({
                    type: 'player_update',
                    transform: {
                        x: camera.position.x,
                        y: camera.position.y - 1.6,
                        z: camera.position.z,
                        ry: yaw
                    }
                }));
            }
        }

        function animate() {
            if (!gameActive) return;
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
