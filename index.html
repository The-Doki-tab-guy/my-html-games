<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNTH PURGE - OVERDRIVE V5 MASTER BUILD</title>
    <style>
        /* ... (previous styles remain the same) ... */
        
        /* Additional multiplayer styles */
        .room-status {
            color: #0ff;
            font-family: monospace;
            font-size: 14px;
            padding: 8px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #0ff;
            margin-top: 10px;
            text-align: center;
        }
        
        .connection-status {
            padding: 4px 12px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .connection-status.connected {
            color: #0f0;
            border: 1px solid #0f0;
            background: rgba(0, 255, 0, 0.1);
        }
        
        .connection-status.disconnected {
            color: #f00;
            border: 1px solid #f00;
            background: rgba(255, 0, 0, 0.1);
        }
        
        .connection-status.connecting {
            color: #ff0;
            border: 1px solid #ff0;
            background: rgba(255, 255, 0, 0.1);
        }
        
        #multiplayer-status {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #333;
            background: rgba(0,0,0,0.5);
            font-family: monospace;
            font-size: 12px;
            color: #aaa;
            display: none;
        }
        
        #multiplayer-status .status-line {
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        #multiplayer-status .status-line:last-child {
            border-bottom: none;
        }
        
        #server-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 0;
        }
    </style>
</head>
<body>
    <!-- ... (previous HTML structure remains the same, update multiplayer panel) ... -->
    
    <div id="multiplayer-panel" style="display:none;">
        <div class="section-header">Server</div>
        <input type="text" id="server-url" class="lobby-input" value="wss://your-worker-name.workers.dev/ws" placeholder="WS URL (e.g., wss://synth-purge.workers.dev/ws)">
        <div style="display: flex; gap: 10px; align-items: center; padding: 5px 0;">
            <button class="main-btn" id="connect-server-btn" style="flex:0; padding: 10px 20px; border-color:#0f0; color:#0f0; font-size:14px;">CONNECT</button>
            <span id="connection-status" class="connection-status disconnected">DISCONNECTED</span>
        </div>
        
        <div id="server-info" style="display:none; background:rgba(0,0,0,0.5); padding:10px; margin:5px 0; border:1px solid #0ff; font-family:monospace; font-size:12px; color:#0ff;">
            <div>🟢 Server: <span id="server-status-text">Connected</span></div>
            <div>👥 Players Online: <span id="server-players-count">0</span></div>
        </div>
        
        <div class="section-header">Room</div>
        <input type="text" id="room-code-input" class="lobby-input" placeholder="ROOM CODE (6 characters)" maxlength="6">
        <div class="menu-btn-container">
            <button class="main-btn" id="create-room-btn" style="border-color:#0ff; color:#0ff;">HOST ROOM</button>
            <button class="main-btn" id="join-room-btn" style="border-color:#f0f; color:#f0f;">JOIN ROOM</button>
        </div>

        <div id="room-panel">
            <div id="room-code-display">ROOM: <span id="room-code-text">------</span></div>
            <div style="color:#aaa; font-size:12px; font-family:monospace; padding:5px;">
                <span id="room-player-count">0</span>/<span id="room-max-players">8</span> players
            </div>
            <ul id="player-list"></ul>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="main-btn" id="ready-btn" style="flex:1; border-color:#0f0; color:#0f0; font-size:16px; padding:8px;">READY</button>
                <button class="main-btn" id="leave-room-btn" style="flex:1; border-color:#f00; color:#f00; font-size:16px; padding:8px;">LEAVE</button>
            </div>
            <button class="main-btn" id="start-game-btn" style="margin-top: 15px; width: 100%; border-color:#ff0; color:#ff0;">LAUNCH NET GRID</button>
            
            <div id="multiplayer-status"></div>
        </div>
    </div>
    
    <!-- ... (rest of HTML remains the same) ... -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- GAME/RUN STATE ---
        let gameActive = false;
        let isPaused = false;
        let difficulty = 'normal';
        const diffSettings = {
            easy:   { healthMult: 0.7, speedMult: 0.85, spawnMult: 0.7, creditMult: 1.25, startCredits: 500 },
            normal: { healthMult: 1.0, speedMult: 1.0,  spawnMult: 1.0, creditMult: 1.0,  startCredits: 0 },
            hard:   { healthMult: 1.5, speedMult: 1.25, spawnMult: 1.4, creditMult: 1.5,  startCredits: 0 }
        };
 
        // DOM elements
        const nameInput = document.getElementById('player-name');
        const hudCreditsDisplay = document.getElementById('hud-credits');
 
        // Best wave record (persisted)
        let bestWave = parseInt(localStorage.getItem('synthPurge_bestWave')) || 0;
        document.getElementById('best-wave-status').textContent = bestWave > 0 ? `BEST WAVE REACHED: ${bestWave}` : 'NO RUNS RECORDED YET';
 
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                difficulty = btn.dataset.diff;
                document.querySelectorAll('.diff-btn').forEach(b => b.style.boxShadow = 'none');
                btn.style.boxShadow = `0 0 20px ${getComputedStyle(btn).color}`;
            });
        });
 
        // Initial Time Status
        const currentHour = new Date().getHours();
        const currentMins = new Date().getMinutes().toString().padStart(2, '0');
        const isDaytime = currentHour >= 6 && currentHour < 18;
        document.getElementById('time-status').textContent = `[LOCAL CLOCK: ${currentHour}:${currentMins}] :: [ENVIRONMENT: ${isDaytime ? 'NEON SUNRISE' : 'MIDNIGHT GRID'}]`;
 
        // --- GAME ENVIRONMENT SETTINGS ---
        const envSettings = {
            skyColor: isDaytime ? 0x110022 : 0x050510,
            fogDensity: 0.008,
            ambientLight: 0.6,
            groundC1: '#0a0a1a', groundC2: '#ff00ff',
            wallC1: '#111122', wallC2: '#00ffff'
        };
 
        // --- MULTIPLAYER SYSTEM ---
        let ws = null;
        let isConnected = false;
        let playerId = null;
        let currentRoomCode = null;
        let isHost = false;
        let isReady = false;
        let multiPlayerData = {};
        let remotePlayers = new Map();
        
        // DOM refs for multiplayer
        const serverUrlInput = document.getElementById('server-url');
        const connectBtn = document.getElementById('connect-server-btn');
        const connectionStatus = document.getElementById('connection-status');
        const serverInfo = document.getElementById('server-info');
        const serverStatusText = document.getElementById('server-status-text');
        const serverPlayersCount = document.getElementById('server-players-count');
        const roomCodeInput = document.getElementById('room-code-input');
        const createRoomBtn = document.getElementById('create-room-btn');
        const joinRoomBtn = document.getElementById('join-room-btn');
        const roomCodeText = document.getElementById('room-code-text');
        const roomPlayerCount = document.getElementById('room-player-count');
        const roomMaxPlayers = document.getElementById('room-max-players');
        const playerListEl = document.getElementById('player-list');
        const readyBtn = document.getElementById('ready-btn');
        const leaveRoomBtn = document.getElementById('leave-room-btn');
        const startGameBtn = document.getElementById('start-game-btn');
        const multiStatus = document.getElementById('multiplayer-status');
        
        // Mode switching
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const mode = btn.dataset.mode;
                document.getElementById('singleplayer-panel').style.display = mode === 'single' ? 'block' : 'none';
                document.getElementById('multiplayer-panel').style.display = mode === 'multi' ? 'block' : 'none';
            });
        });
        
        // Connect to server
        connectBtn.addEventListener('click', () => {
            connectToServer();
        });
        
        function connectToServer() {
            const url = serverUrlInput.value.trim();
            if (!url) {
                alert('Please enter a WebSocket URL');
                return;
            }
            
            updateConnectionStatus('connecting');
            
            try {
                ws = new WebSocket(url);
                
                ws.onopen = () => {
                    isConnected = true;
                    updateConnectionStatus('connected');
                    serverInfo.style.display = 'block';
                    serverStatusText.textContent = 'Connected';
                    
                    // Authenticate
                    const playerName = document.getElementById('player-name').value.trim() || 'CYBER_PILOT';
                    ws.send(JSON.stringify({
                        type: 'auth',
                        name: playerName
                    }));
                };
                
                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handleServerMessage(data);
                    } catch (e) {
                        console.error('Error parsing server message:', e);
                    }
                };
                
                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    updateConnectionStatus('disconnected');
                    serverInfo.style.display = 'none';
                    addKillMessage('⚠ SERVER CONNECTION ERROR');
                };
                
                ws.onclose = () => {
                    isConnected = false;
                    updateConnectionStatus('disconnected');
                    serverInfo.style.display = 'none';
                    addKillMessage('⚠ SERVER DISCONNECTED');
                    if (currentRoomCode) {
                        leaveRoom();
                    }
                };
                
            } catch (e) {
                console.error('Connection failed:', e);
                updateConnectionStatus('disconnected');
                alert('Failed to connect to server. Check the URL and try again.');
            }
        }
        
        function updateConnectionStatus(status) {
            connectionStatus.textContent = status.toUpperCase();
            connectionStatus.className = 'connection-status ' + status;
        }
        
        function handleServerMessage(data) {
            switch (data.type) {
                case 'auth_success':
                    playerId = data.playerId;
                    addKillMessage(`✅ AUTHENTICATED AS ${data.name}`);
                    break;
                    
                case 'room_created':
                    currentRoomCode = data.roomCode;
                    isHost = true;
                    roomCodeText.textContent = data.roomCode;
                    updatePlayerList(data.players);
                    showRoomPanel(true);
                    addKillMessage(`🏠 ROOM CREATED: ${data.roomCode}`);
                    break;
                    
                case 'room_joined':
                    currentRoomCode = data.roomCode;
                    isHost = false;
                    roomCodeText.textContent = data.roomCode;
                    updatePlayerList(data.players);
                    showRoomPanel(true);
                    addKillMessage(`🏠 JOINED ROOM: ${data.roomCode}`);
                    break;
                    
                case 'room_update':
                    updatePlayerList(data.players);
                    if (data.isStarted) {
                        startGameBtn.disabled = true;
                        startGameBtn.textContent = 'GAME IN PROGRESS';
                    }
                    break;
                    
                case 'game_started':
                    addKillMessage('⚡ GAME STARTING!');
                    startMultiplayerGame(data.gameState, data.players);
                    break;
                    
                case 'game_state_update':
                    updateMultiplayerGameState(data.gameState, data.playerId);
                    break;
                    
                case 'player_action':
                    handleRemotePlayerAction(data.playerId, data.action, data.data);
                    break;
                    
                case 'player_disconnected':
                    addKillMessage(`👋 PLAYER ${data.playerId} DISCONNECTED`);
                    remotePlayers.delete(data.playerId);
                    break;
                    
                case 'error':
                    addKillMessage(`❌ ${data.message}`);
                    break;
                    
                case 'pong':
                    // Keep alive
                    break;
                    
                case 'left_room':
                case 'room_closed':
                    leaveRoom();
                    break;
                    
                default:
                    console.log('Unknown message type:', data.type);
            }
        }
        
        function showRoomPanel(show) {
            document.getElementById('room-panel').style.display = show ? 'block' : 'none';
            if (show) {
                createRoomBtn.disabled = true;
                joinRoomBtn.disabled = true;
                roomCodeInput.disabled = true;
            } else {
                createRoomBtn.disabled = false;
                joinRoomBtn.disabled = false;
                roomCodeInput.disabled = false;
            }
        }
        
        function updatePlayerList(players) {
            playerListEl.innerHTML = '';
            players.forEach(p => {
                const li = document.createElement('li');
                li.className = 'player-item';
                const nameSpan = document.createElement('span');
                nameSpan.textContent = p.name;
                
                const badges = document.createElement('span');
                if (p.isHost) {
                    const badge = document.createElement('span');
                    badge.className = 'op-badge';
                    badge.textContent = '[HOST]';
                    badges.appendChild(badge);
                }
                if (p.isOperator) {
                    const badge = document.createElement('span');
                    badge.className = 'op-badge';
                    badge.textContent = '[OP]';
                    badges.appendChild(badge);
                }
                if (p.ready) {
                    const badge = document.createElement('span');
                    badge.style.color = '#0f0';
                    badge.textContent = '✅ READY';
                    badges.appendChild(badge);
                } else {
                    const badge = document.createElement('span');
                    badge.style.color = '#f00';
                    badge.textContent = '⏳ WAITING';
                    badges.appendChild(badge);
                }
                
                // Promote button for host
                if (isHost && !p.isHost) {
                    const promoteBtn = document.createElement('button');
                    promoteBtn.className = 'op-btn';
                    promoteBtn.textContent = p.isOperator ? 'DEMOTE' : 'PROMOTE';
                    promoteBtn.onclick = () => {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({
                                type: 'promote_operator',
                                targetPlayerId: p.id,
                                promote: !p.isOperator
                            }));
                        }
                    };
                    badges.appendChild(promoteBtn);
                }
                
                li.appendChild(nameSpan);
                li.appendChild(badges);
                playerListEl.appendChild(li);
            });
            
            roomPlayerCount.textContent = players.length;
            roomMaxPlayers.textContent = 8;
            
            // Update ready button state
            const myPlayer = players.find(p => p.id === playerId);
            if (myPlayer) {
                isReady = myPlayer.ready;
                readyBtn.textContent = isReady ? 'NOT READY' : 'READY';
                readyBtn.style.borderColor = isReady ? '#f00' : '#0f0';
                readyBtn.style.color = isReady ? '#f00' : '#0f0';
            }
        }
        
        // Room actions
        createRoomBtn.addEventListener('click', () => {
            if (!isConnected || !ws) {
                alert('Connect to server first');
                return;
            }
            
            let code = roomCodeInput.value.trim().toUpperCase();
            if (!code || code.length !== 6) {
                // Generate random code
                code = generateRoomCode();
                roomCodeInput.value = code;
            }
            
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'create_room',
                    roomCode: code,
                    playerName: document.getElementById('player-name').value.trim() || 'CYBER_PILOT'
                }));
            }
        });
        
        joinRoomBtn.addEventListener('click', () => {
            if (!isConnected || !ws) {
                alert('Connect to server first');
                return;
            }
            
            const code = roomCodeInput.value.trim().toUpperCase();
            if (!code || code.length !== 6) {
                alert('Please enter a valid 6-character room code');
                return;
            }
            
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'join_room',
                    roomCode: code,
                    playerName: document.getElementById('player-name').value.trim() || 'CYBER_PILOT'
                }));
            }
        });
        
        readyBtn.addEventListener('click', () => {
            if (!ws || !currentRoomCode) return;
            
            isReady = !isReady;
            ws.send(JSON.stringify({
                type: 'set_ready',
                ready: isReady
            }));
        });
        
        leaveRoomBtn.addEventListener('click', leaveRoom);
        
        function leaveRoom() {
            if (ws && ws.readyState === WebSocket.OPEN && currentRoomCode) {
                ws.send(JSON.stringify({
                    type: 'leave_room'
                }));
            }
            currentRoomCode = null;
            isHost = false;
            isReady = false;
            showRoomPanel(false);
            roomCodeText.textContent = '------';
            remotePlayers.clear();
            addKillMessage('🚪 LEFT ROOM');
        }
        
        startGameBtn.addEventListener('click', () => {
            if (!ws || !currentRoomCode || !isHost) {
                alert('Only the host can start the game');
                return;
            }
            
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'start_game'
                }));
            }
        });
        
        function generateRoomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }
 
        // LAUNCH BUTTON
        document.getElementById('start-offline-btn').addEventListener('click', startOfflineGame);
 
        // --- GAME LAUNCH SEQUENCE ---
        function startOfflineGame() {
            if (document.querySelector('.mode-btn.active').dataset.mode === 'multi') {
                // Multiplayer mode - wait for server to start
                alert('Please connect to a server and join/host a room to play multiplayer');
                return;
            }
            
            const settings = diffSettings[difficulty];
            totalCredits += settings.startCredits;
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';
            updateRoleHUD();
            document.getElementById('hud-credits').textContent = totalCredits;
 
            initAudio(); // Initialize sound engine
 
            // Spawn world
            createShopTerminal(20, -20);
            createShopTerminal(-40, 50);
            new Car(10, 10);
            new Car(-15, -15);
            new Plane(25, 25);
            new Plane(-30, 10);
            
            // Spawn ammo crates
            for (let i = 0; i < 12; i++) {
                const x = (Math.random() - 0.5) * 160;
                const z = (Math.random() - 0.5) * 160;
                if (Math.abs(x) > 20 || Math.abs(z) > 20) {
                    new AmmoCrate(x, z);
                }
            }
            
            for (let i = 0; i < Math.round(10 * settings.spawnMult); i++) spawnEnemy();
 
            gameActive = true;
            updateWeaponUI();
            renderer.domElement.requestPointerLock();
            lastTime = performance.now();
            
            // Start supply drop timer
            supplyDropTimer = 30; // First drop in 30 seconds
            animate();
        }
 
        function updateRoleHUD() {
            document.getElementById('role-text').textContent = difficulty.toUpperCase();
        }
 
        // --- PAUSE MENU ---
        function togglePause() {
            if (!gameActive) return;
            isPaused = !isPaused;
            if (isPaused) {
                document.exitPointerLock();
                document.getElementById('pause-stats').textContent = `WAVE ${waveNum} :: KILLS ${player.kills} :: CREDITS ${totalCredits}`;
                document.getElementById('pause-menu').style.display = 'flex';
            } else {
                document.getElementById('pause-menu').style.display = 'none';
                renderer.domElement.requestPointerLock();
            }
        }
        document.getElementById('resume-btn').addEventListener('click', togglePause);
        document.getElementById('quit-btn').addEventListener('click', () => {
            if (waveNum > bestWave) { bestWave = waveNum; localStorage.setItem('synthPurge_bestWave', bestWave); }
            location.reload();
        });
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && gameActive && !isConsoleOpen && !isShopOpen) togglePause(); });
 
        // --- WEBAUDIO ENGINE (V3/V4 Restored) ---
        let audioCtx, bassCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            if (!bassCtx) {
                bassCtx = new (window.AudioContext || window.webkitAudioContext)();
                setInterval(() => {
                    if(!gameActive || player.isDead || isShopOpen || isConsoleOpen) return;
                    const osc = bassCtx.createOscillator();
                    const gain = bassCtx.createGain();
                    osc.connect(gain); gain.connect(bassCtx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(55, bassCtx.currentTime); // Deep Bass A1
                    gain.gain.setValueAtTime(0.15, bassCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, bassCtx.currentTime + 0.15);
                    osc.start(); osc.stop(bassCtx.currentTime + 0.15);
                }, 300); // 16-bit bassline beat
            }
        }
        
        function playSound(type, pitchOverride = null) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'shoot') {
                osc.type = pitchOverride > 1000 ? 'sawtooth' : (pitchOverride < 500 ? 'square' : 'triangle');
                osc.frequency.setValueAtTime(pitchOverride || 800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'dash') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.4);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'bossDeath') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(50, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(10, audioCtx.currentTime + 2.0);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2.0);
                osc.start(); osc.stop(audioCtx.currentTime + 2.0);
            } else if (type === 'pickup') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'supply') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.5);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            }
        }
 
        // --- THREE.JS SCENE SETUP ---
        function createGridTexture(color1, color2) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color1; ctx.fillRect(0, 0, 512, 512);
            ctx.strokeStyle = color2; ctx.lineWidth = 4;
            for(let i=0; i<=512; i+=64) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // --- SHOOTING LOGIC ---
        function handleShooting(wp, now) {
            lastShotTime = now;
            if (!player.infiniteAmmo) player.ammo -= wp.cost;
            playSound('shoot', wp.pitch);
            screenShake = player.state === 'flying' ? 0.02 : 0.05;
            flashLight.intensity = 3; flashLight.color.set(wp.color);
            setTimeout(() => flashLight.intensity = 0, 50);
            const cross = document.getElementById('crosshair');
            cross.classList.add('shooting'); setTimeout(() => cross.classList.remove('shooting'), 60);
 
            let rayOrigin = camera.position;
            let rayDir = new THREE.Vector3();
            camera.getWorldDirection(rayDir);
            if (player.state === 'flying') {
                rayOrigin = player.currentPlane.group.position.clone();
                player.currentPlane.group.getWorldDirection(rayDir);
            }
            const pelletCount = wp.pellets || 1;
            for (let p = 0; p < pelletCount; p++) {
                let dir = rayDir.clone();
                if (wp.spread) {
                    dir.x += (Math.random() - 0.5) * wp.spread;
                    dir.y += (Math.random() - 0.5) * wp.spread;
                    dir.z += (Math.random() - 0.5) * wp.spread;
                    dir.normalize();
                }
                const raycaster = new THREE.Raycaster(rayOrigin, dir);
                const intersects = raycaster.intersectObjects(enemies.map(e => e.group), true);
 
                if (intersects.length > 0) {
                    let target = intersects[0].object;
                    while(target.parent && target.userData.health === undefined) target = target.parent;
                    if(target.userData && target.userData.health !== undefined) {
                        resolveHit(target, wp);
                    }
                }
            }
            
            // Send shooting action to server (for multiplayer)
            if (ws && ws.readyState === WebSocket.OPEN && currentRoomCode) {
                ws.send(JSON.stringify({
                    type: 'player_action',
                    action: 'shoot',
                    data: {
                        weapon: player.weaponIndex,
                        position: camera.position.clone()
                    }
                }));
            }
        }
 
        function resolveHit(target, wp) {
            playSound('hit');
            target.userData.health -= (wp.dmg * player.dmgMultiplier);
            target.userData.hitEffect = 10;
            if (target.userData.health <= 0) {
                const isBoss = target.userData.isBoss; const isFinal = target.userData.isFinalBoss;
                spawnExplosion(target.position, isFinal ? 300 : (isBoss ? 150 : 20), isBoss || isFinal);
                removeEnemy(target);
                const cMult = diffSettings[difficulty].creditMult;
                if (isFinal) { playSound('bossDeath'); screenShake = 1.5; player.kills += 50; const gain = Math.round(25000 * cMult); totalCredits += gain; addKillMessage(`NEXUS APEX DESTROYED [+${gain} CR]`);
                } else if (isBoss) { playSound('bossDeath'); screenShake = 0.8; player.kills += 5; const gain = Math.round(5000 * cMult); totalCredits += gain; addKillMessage(`OMEGA CONSTRUCT PURGED [+${gain} CR]`);
                } else { player.kills++; const gain = Math.round(200 * cMult); totalCredits += gain; addKillMessage(`ENTITY SHATTERED [+${gain} CR]`); }
                localStorage.setItem('synthPurge_credits', totalCredits);
                document.getElementById('shop-credits-display').textContent = totalCredits;
                document.getElementById('hud-credits').textContent = totalCredits;
            }
        }

        function updateMultiplayerGameState(gameState, playerId) {

            if (gameState && gameState.players) {
                Object.keys(gameState.players).forEach(id => {
                    if (id !== playerId && remotePlayers.has(id)) {
                        const data = gameState.players[id];
                        const remote = remotePlayers.get(id);
                        if (data.position) {
                            remote.group.position.set(data.position.x, data.position.y, data.position.z);
                            remote.position = new THREE.Vector3(data.position.x, data.position.y, data.position.z);
                        }
                        if (data.health !== undefined) {
                            remote.health = data.health;
                        }
                    }
                });

        // --- GAME LOOP ---
        let lastTime = 0;
 
        function update() {
            const now = performance.now();
            const delta = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now; const timeSec = now / 1000;
 
            if (player.isDead || !gameActive || isShopOpen || isConsoleOpen || isPaused) { isMouseDown = false; if(player.isDead || isPaused) return; }
 
            // Weapon Auto-fire
            if (isMouseDown && (player.state === 'walking' || player.state === 'flying')) {
                const wp = weapons[player.weaponIndex];
                if(wp.name === 'V-BLASTER' || player.weaponIndex === 0) {
                    if (now - lastShotTime > wp.cd && (player.ammo >= wp.cost || player.infiniteAmmo)) {
                        handleShooting(wp, now);
                    }
                } else if (!isMouseDownPrev) {
                    if (now - lastShotTime > wp.cd && (player.ammo >= wp.cost || player.infiniteAmmo)) {
                        handleShooting(wp, now);
                    }
                }
            }
            isMouseDownPrev = isMouseDown;
 
            interactTarget = null; document.getElementById('interaction-prompt').style.display = 'none';
 
            // Update Particles
            for(let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.addScaledVector(p.velocity, delta); p.life -= delta * 1.5; p.scale.setScalar(Math.max(0, p.life));
                if(p.life <= 0) { scene.remove(p); particles.splice(i, 1); }
            }
            
            // Update Ammo Crates
            ammoCrates.forEach(crate => crate.update(delta, timeSec));
            
            // Update Supply Drop
            updateSupplyDrop(delta, timeSec);
            
            // Supply Drop Timer
            if (!supplyDropActive) {
                supplyDropTimer -= delta;
                if (supplyDropTimer <= 0) {
                    spawnSupplyDrop();
                    supplyDropTimer = 45 + Math.random() * 30; // Next drop in 45-75 seconds
                }
            }
 
            // --- MOVEMENT STATE MACHINE ---
            if (player.state === 'walking') {
                const moveDir = new THREE.Vector3();
                if (keys['w']) moveDir.z += 1;
                if (keys['s']) moveDir.z -= 1;
                if (keys['a']) moveDir.x += 1;
                if (keys['d']) moveDir.x -= 1;
 
                const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir);
                const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), camDir).normalize();
                const forward = new THREE.Vector3(camDir.x, 0, camDir.z).normalize();
 
                if (moveDir.length() > 0) {
                    moveDir.normalize();
                    const speed = 14 * player.speedMultiplier;
                    player.velocity.x = (right.x * moveDir.x + forward.x * moveDir.z) * speed;
                    player.velocity.z = (right.z * moveDir.x + forward.z * moveDir.z) * speed;
                } else { player.velocity.x *= 0.75; player.velocity.z *= 0.75; }
 
                if (keys['shift'] && player.dashCooldown <= 0 && moveDir.length() > 0) {
                    player.velocity.x += (right.x * moveDir.x + forward.x * moveDir.z) * 80;
                    player.velocity.z += (right.z * moveDir.x + forward.z * moveDir.z) * 80;
                    player.dashCooldown = player.dashCooldownMax; playSound('dash'); screenShake = 0.1;
                }
                if (player.dashCooldown > 0) player.dashCooldown -= delta;
                document.getElementById('dash-bar-container').style.display = 'block';
                document.getElementById('dash-fill').style.width = Math.max(0, (1 - (player.dashCooldown / player.dashCooldownMax)) * 100) + '%';
 
                player.velocity.y -= 35 * delta;
                camera.position.y += player.velocity.y * delta;
                if (camera.position.y <= 1.8) { camera.position.y = 1.8; player.velocity.y = 0; player.grounded = true; }
                else { player.grounded = false; }
                if (keys[' '] && player.grounded && !isConsoleOpen) { player.velocity.y = 14; keys[' '] = false; }
 
                camera.position.x += player.velocity.x * delta; camera.position.z += player.velocity.z * delta;
                camera.rotation.order = 'YXZ'; camera.rotation.y = yaw; camera.rotation.x = pitch;
 
                let nearestDist = 8;
                carEntities.forEach(car => { const dist = camera.position.distanceTo(car.group.position); if (dist < nearestDist) { nearestDist = dist; interactTarget = { type: 'car', obj: car }; } });
                planeEntities.forEach(plane => { const dist = camera.position.distanceTo(plane.group.position); if (dist < nearestDist) { nearestDist = dist; interactTarget = { type: 'plane', obj: plane }; } });
                shopEntities.forEach(shop => { const dist = camera.position.distanceTo(shop.position); if (dist < nearestDist) { nearestDist = dist; interactTarget = { type: 'shop', obj: shop }; } });
                if (interactTarget) document.getElementById('interaction-prompt').style.display = 'block';
 
            } else if (player.state === 'driving') {
                const car = player.currentCar;
                if (keys['s']) car.speed += player.carAccel;
                if (keys['w']) car.speed -= player.carAccel;
                car.speed *= 0.96; car.speed = Math.max(-player.carMaxSpeed/2, Math.min(player.carMaxSpeed, car.speed));
                if (Math.abs(car.speed) > 0.05) {
                    if (keys['a']) car.angle += 0.05 * Math.sign(car.speed);
                    if (keys['d']) car.angle -= 0.05 * Math.sign(car.speed);
                }
                car.group.rotation.y = car.angle;
                car.group.position.x += Math.sin(car.angle) * car.speed; car.group.position.z += Math.cos(car.angle) * car.speed;
 
                car.group.position.y += car.yVelocity * delta;
                if(car.group.position.y > 0.5) { car.yVelocity -= 40 * delta; 
                } else { car.group.position.y = 0.5; car.yVelocity = 0; if (keys[' ']) { car.yVelocity = 20; playSound('dash'); keys[' '] = false; } }
                
                camera.position.x = car.group.position.x - Math.sin(car.angle) * 10;
                camera.position.z = car.group.position.z - Math.cos(car.angle) * 10;
                camera.position.y = car.group.position.y + 4; camera.lookAt(car.group.position); yaw = camera.rotation.y;
 
                document.getElementById('dash-speed').textContent = Math.floor(Math.abs(car.speed) * 70);
                document.getElementById('dash-rpm').textContent = Math.floor(Math.abs(car.speed) * 3500 + 1000 + Math.random() * 200);
                document.getElementById('dash-bar-container').style.display = 'none';
                
            } else if (player.state === 'flying') {
                const p = player.currentPlane;
                if (keys[' ']) p.speed += 40 * delta;
                if (keys['shift']) p.speed -= 40 * delta;
                p.speed *= 0.99; p.speed = Math.max(0, Math.min(120, p.speed));
                
                if (keys['s']) p.pitch += 2.0 * delta;
                if (keys['w']) p.pitch -= 2.0 * delta;
                if (keys['a']) { p.roll += 3.0 * delta; p.yaw += 1.5 * delta; }
                if (keys['d']) { p.roll -= 3.0 * delta; p.yaw -= 1.5 * delta; }
                if (!keys['a'] && !keys['d']) p.roll *= 0.92;
 
                p.group.rotation.set(p.pitch, p.yaw, p.roll, 'YXZ');
                
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(p.group.quaternion);
                p.group.position.addScaledVector(forward, p.speed * delta);
                
                if (p.group.position.y < 1.5) { p.group.position.y = 1.5; p.pitch = Math.max(0, p.pitch); }
                if (p.group.position.y > 400) p.group.position.y = 400;
                
                const camOffset = new THREE.Vector3(0, 5, 15).applyQuaternion(p.group.quaternion);
                camera.position.copy(p.group.position).add(camOffset); camera.lookAt(p.group.position); yaw = camera.rotation.y; pitch = camera.rotation.x;
 
                document.getElementById('dash-speed').textContent = Math.floor(p.speed * 8);
                document.getElementById('dash-rpm').textContent = Math.floor(p.speed * 80 + 2000 + Math.random() * 100);
                document.getElementById('dash-bar-container').style.display = 'none';
            }
 
            if(screenShake > 0) { camera.rotation.z = (Math.random() - 0.5) * screenShake; screenShake -= delta;
            } else if (player.state !== 'flying') { camera.rotation.z = 0; }
 
            // Update Entities
            enemies.forEach(enemy => enemy.update(delta, timeSec));
            
            // --- WAVE & BOSS LOGIC ---
            if (enemies.length === 0 && gameActive) {
                waveNum++;
                document.getElementById('wave-num').textContent = waveNum;
 
                const spawnMult = diffSettings[difficulty].spawnMult;
                if (waveNum % 10 === 0) {
                    const angle = Math.random() * Math.PI * 2; new FinalBoss(Math.cos(angle) * 120, Math.sin(angle) * 120);
                    for (let i = 0; i < Math.round(8 * spawnMult); i++) spawnEnemy(); addKillMessage('SYS: CRITICAL WARNING! NEXUS APEX DETECTED');
                } else if (waveNum % 3 === 0) {
                    const angle = Math.random() * Math.PI * 2; new Boss(Math.cos(angle) * 80, Math.sin(angle) * 80);
                    for (let i = 0; i < Math.round(5 * spawnMult); i++) spawnEnemy(); addKillMessage('SYS: WARNING! OMEGA CONSTRUCT DETECTED');
                } else {
                    for (let i = 0; i < Math.round((10 + Math.floor(waveNum * 1.5)) * spawnMult); i++) spawnEnemy();
                    addKillMessage(`SYS: ESCALATION DETECTED - WAVE ${waveNum}`);
                }
                if (waveNum > bestWave) { bestWave = waveNum; localStorage.setItem('synthPurge_bestWave', bestWave); }
            }
 
            // Passive regen
            if (player.regenRate > 0 && !player.isDead && player.health < player.maxHealth) {
                player.health = Math.min(player.maxHealth, player.health + player.regenRate * delta);
            }
 
            // HUD updates
            document.getElementById('ammo-counter').textContent = player.infiniteAmmo ? 'INF' : player.ammo;
            document.getElementById('health-fill').style.width = Math.max(0, (player.health / player.maxHealth) * 100) + '%';
            
            // Send periodic updates in multiplayer
            if (gameActive && ws && currentRoomCode && !isPaused) {
                if (Math.floor(performance.now() / 100) % 2 === 0) { // Every 200ms
                    sendGameUpdate();
                }
            }
        }
 
        // Standard render loop
        function animate() { if (!gameActive) return; requestAnimationFrame(animate); update(); renderer.render(scene, camera); }
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        
        // --- INITIALIZATION ---
        // Set default server URL based on current host
        const currentHost = window.location.hostname;
        if (currentHost !== 'localhost' && currentHost !== '127.0.0.1') {
            // Running on Cloudflare or similar
            serverUrlInput.value = `wss://${currentHost}/ws`;
        }
        
        console.log('SYNTH PURGE v5.0 - Multiplayer Ready');
    </script>
</body>
</html>
